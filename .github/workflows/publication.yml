name: Publication integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate publication
        run: python3 scripts/validate_publication.py
      - name: Test rejection and acceptance cases
        run: python3 -m unittest discover -s tests -v
